name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "google_scholar_crawler/requirements.txt"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check -r google_scholar_crawler/requirements.txt

      - name: Fetch citation stats
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

      - name: Publish citation stats branch
        working-directory: google_scholar_crawler/results
        run: |
          git init --initial-branch=google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update citation data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin google-scholar-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
